[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-agent1"
version = "0.2.0"
description = "A practical LangChain customer-service agent reference with FastAPI, LangGraph persistence, tools, Markdown skills, RAG, CLI, and tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "jieba>=0.42.1,<0.43",
    "langchain>=1.3,<2.0",
    "langchain-core>=1.4,<2.0",
    "langchain-openai>=1.3,<2.0",
    "langchain-text-splitters>=1.1,<2.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.5,<3.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "pre-commit>=4.0,<5.0",
]
mcp = [
    "mcp>=1.9,<2.0",
]

[project.scripts]
customer-agent = "customer_service_agent.cli:main"
customer-agent-api = "customer_service_agent.api:run"
customer-agent-mcp = "customer_service_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer_service_agent = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
